name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test, verify, and build plugin
        run: bash ./gradlew test verifyPlugin buildPlugin

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: import-trimmer-plugin
          path: build/distributions/*.zip
          if-no-files-found: error